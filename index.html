<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해성발전기 매출 시트</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#1d2430; --muted:#6a7382; --line:#cfd5dd; --line-strong:#2b3441; --head:#e9edf2;
    --paper:#fff; --bg:#f3f5f8; --accent:#1f5fa8; --minus:#c0392b; --auto:#f7f9fb;
    --done:#1e7d4f; --done-bg:#e3f4ea; --open:#a4591b; --open-bg:#fbeee0; --lt:#5b3fa0; --lt-bg:#efeafa;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:14px;
    padding-bottom:env(safe-area-inset-bottom,0px); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
    padding:18px 24px; padding-top:calc(18px + env(safe-area-inset-top,0px));
    background:var(--paper); border-bottom:2px solid var(--line-strong); }
  h1 { margin:0; font-size:20px; font-weight:600; }
  .lock { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
  .lock[hidden] { display:none; }
  .lockbox { background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--line-strong); border-radius:8px;
    padding:28px 24px; width:100%; max-width:340px; text-align:center; }
  .lockbox h2 { margin:0 0 6px; font-size:18px; }
  .lockbox p { margin:0 0 14px; color:var(--muted); }
  .lockbox input { width:100%; font:inherit; font-size:22px; letter-spacing:4px; text-align:center; padding:10px;
    border:1px solid var(--line); border-radius:6px; margin-bottom:8px; }
  .lockbox button { width:100%; padding:12px; font-size:16px; }
  .lockhint { font-size:13px; }
  .uidlg { position:fixed; inset:0; z-index:60; background:rgba(20,26,36,.45); display:flex; align-items:center; justify-content:center; padding:20px; }
  .uidlg-box { background:var(--paper); border-radius:10px; padding:22px 20px 16px; width:100%; max-width:380px; box-shadow:0 12px 40px rgba(0,0,0,.25); }
  .uidlg-msg { margin:0 0 14px; white-space:pre-line; line-height:1.55; font-size:15px; }
  .uidlg-in { width:100%; font:inherit; font-size:18px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:14px; }
  .uidlg-in.pin { letter-spacing:4px; text-align:center; font-size:22px; }
  .uidlg-btns { display:flex; justify-content:flex-end; gap:8px; }
  .uidlg-btns button { min-width:80px; padding:9px 16px; }
  .uidlg-btns .danger { background:var(--minus); border-color:var(--minus); color:#fff; }
  .pin { -webkit-text-security:disc; text-security:disc; }
  .lockmsg { color:var(--minus) !important; min-height:18px; font-size:13px; margin:0 0 8px !important; }
  .titlebox { display:flex; flex-direction:column; gap:3px; }
  .savestatus { font-size:12px; color:var(--done); }
  .savestatus.warn { color:#a4591b; }
  .savestatus.bad { color:#fff; background:var(--minus); padding:3px 8px; border-radius:4px; font-weight:600; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--line-strong); background:var(--paper);
    color:var(--ink); border-radius:4px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.link { border:0; background:none; padding:2px 8px; color:var(--accent); font-size:13px; }
  button.link:hover { text-decoration:underline; }
  button.link.danger { color:var(--muted); }
  button.link.danger:hover { color:var(--minus); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

  .filters { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; padding:14px 24px;
    background:var(--paper); border-bottom:1px solid var(--line); }
  .filters label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .filters select { font:inherit; font-size:14px; color:var(--ink); padding:6px 8px;
    border:1px solid var(--line); border-radius:4px; background:#fff; min-width:130px; }
  .filters .count { margin-left:auto; color:var(--muted); font-size:13px; align-self:center; }

  .tabs { display:flex; gap:2px; align-items:flex-end; padding:10px 24px 0; background:var(--head);
    border-bottom:2px solid var(--line-strong); overflow-x:auto; scrollbar-width:thin; }
  .tab { flex:none; border:1px solid var(--line); border-bottom:0; border-radius:6px 6px 0 0; background:#dde3ea;
    color:var(--muted); padding:8px 16px; font-size:14px; margin-bottom:-2px; }
  .tab small { font-size:11px; margin-left:4px; }
  .tab.on { background:var(--paper); color:var(--ink); font-weight:600; border-color:var(--line-strong);
    border-bottom:2px solid var(--paper); }
  .tabdel { display:inline-block; margin-left:8px; padding:0 5px; border-radius:50%; color:var(--muted); font-weight:400; font-size:15px; line-height:18px; }
  .tabdel:hover { background:var(--minus); color:#fff; }
  .tab.add.prev { margin-left:0; margin-right:6px; }
  .tab.add { background:none; border:1px dashed var(--line-strong); color:var(--accent); margin-left:6px; }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 16px; border-radius:6px; font-size:14px; z-index:10;
    opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; }
  .toast.show { opacity:1; }
  tbody.group td { background:var(--lt-bg); color:var(--lt); font-weight:600; text-align:left; padding:6px 12px; height:auto; }
  tbody.group.short td { background:var(--head); color:var(--ink); }
  .group-title { font-weight:600; color:var(--lt); padding:4px 2px; }
  .group-title.short { color:var(--ink); }
  .amtcheck { display:block; margin:6px auto 0; padding:5px 6px; border-radius:4px; font-size:12px; line-height:1.4;
    background:#fff4d6; border:1px solid #e9c46a; color:#7a4f00; text-align:center; max-width:160px; }
  td.status .amtcheck span { display:block; white-space:nowrap; }
  .amtcheck.ok { background:#e6f4ea; border-color:#9ccfb0; color:#1e7d4f; }
  .amtcheck label { display:inline-flex; align-items:center; gap:4px; margin-top:3px; cursor:pointer; font-weight:600; }
  .amtcheck input { width:15px; height:15px; margin:0; }
  .card .amtcheck { max-width:none; margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; text-align:left; }
  .card .amtcheck label { margin:0; }
  .tab .warn { color:#b07400; font-weight:600; }
  td.kindcell { padding:4px; }
  input[data-need="1"] { background:#fff4c8 !important; outline:2px dashed #e0a800; outline-offset:-3px; }
  input[data-need="1"]::placeholder { color:#9a6b00; }
  td.mgr input.cell { min-height:28px; height:28px; }
  td.mgr input.phone { font-size:12px; color:var(--muted); }
  .phonerow { display:flex; gap:6px; }
  .callbtn { flex:none; display:flex; align-items:center; padding:0 16px; border-radius:4px; background:var(--done);
    color:#fff; text-decoration:none; font-size:15px; font-weight:500; }
  td.kindcell select.cell { height:30px; }
  .endchk { display:inline-flex; align-items:center; gap:4px; margin-top:6px; font-size:12px; color:var(--muted);
    cursor:pointer; padding:3px 6px; border:1px solid var(--line); border-radius:4px; background:rgba(255,255,255,.7); white-space:nowrap; }
  .endchk input { width:15px; height:15px; margin:0; accent-color:#444; }
  .endchk.on { color:#fff; background:#4a5261; border-color:#4a5261; }
  .grid2 label.endchk { flex-direction:row; align-items:center; justify-content:center; gap:8px; color:var(--ink); }
  .grid2 label.endchk.on { color:#fff; }
  .card .endchk { font-size:14px; padding:8px 10px; margin-top:0; }
  .badge.end { color:#fff; background:#4a5261; }
  .carry { display:block; font-size:11px; color:var(--lt); margin-top:2px; }
  .due { display:none; margin:16px 24px 0; padding:14px 16px; border:1px solid #cbbdf0; border-left:4px solid var(--lt);
    background:var(--lt-bg); border-radius:4px; }
  .due.show { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  .due strong { color:var(--lt); }
  .due ul { margin:0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:6px; flex:1; }
  .due li { background:#fff; border:1px solid #d9cff5; border-radius:12px; padding:3px 10px; font-size:13px; }
  .due button { background:var(--lt); border-color:var(--lt); color:#fff; }

  .summary { display:flex; flex-wrap:wrap; gap:28px; padding:14px 24px; background:var(--paper); border-bottom:1px solid var(--line); }
  .summary div span { display:block; color:var(--muted); font-size:12px; }
  .summary div strong { font-size:18px; font-weight:600; }

  .wrap { padding:20px 24px 60px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:1740px; background:var(--paper); }
  th, td { border:1px solid var(--line); padding:0; text-align:center; height:30px; }
  th { background:var(--head); font-weight:500; padding:0 6px; }
  tbody.block { border-top:2px solid var(--line-strong); }
  input.cell { width:100%; height:100%; min-height:30px; border:0; background:transparent;
    font:inherit; color:inherit; text-align:center; padding:0 6px; }
  input.num { text-align:right; }
  input.cell:hover { background:#f0f5fb; }
  input.vat-auto::placeholder { color:var(--muted); }
  td.auto { background:var(--auto); text-align:right; padding:0 8px; }
  .minus { color:var(--minus); }
  .itemcell { display:flex; align-items:center; }
  .itemcell input.cell { text-align:left; padding-left:14px; }
  /* 입력한 글자 길이만큼 칸이 자동으로 넓어짐 */
  .autow { display:inline-grid; flex:1 0 auto; }
  .autow::after { content:attr(data-v) "  "; visibility:hidden; white-space:pre; grid-area:1 / 1;
    padding:0 6px 0 14px; font:inherit; height:0; }
  .autow input.cell { grid-area:1 / 1; width:100%; min-width:0; }
  .itemcell button { border:0; background:none; color:var(--muted); padding:0 6px; font-size:16px; visibility:hidden; }
  tr:hover .itemcell button { visibility:visible; }
  .itemcell button:hover { color:var(--minus); }
  tr.addrow td { height:auto; padding:3px 4px; background:#fafbfc; text-align:left; }
  .actions { display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; }
  .actions .spacer { flex:1; }
  .chk { display:inline-flex; align-items:center; gap:5px; font-size:13px; cursor:pointer; padding:2px 6px; }
  .chk input { width:16px; height:16px; margin:0; accent-color:var(--lt); }
  .muted { color:var(--muted); font-size:12px; }
  select.cell { width:100%; height:100%; min-height:30px; border:0; background:transparent; font:inherit;
    color:inherit; text-align:center; text-align-last:center; cursor:pointer; }
  select.cell:hover { background:#f0f5fb; }
  select.kindsel.is-long { color:var(--lt); font-weight:600; }
  select.f { appearance:auto; }
  td.period { padding:4px 2px; }
  td.period input.cell { min-height:28px; height:28px; font-size:13px; }
  .tilde { display:block; color:var(--muted); line-height:1; }
  .days { display:block; font-size:12px; color:var(--muted); margin-top:4px; min-height:14px; }
  .bad { color:var(--minus); }
  td.status { padding:4px; }
  .badge { display:inline-block; padding:3px 8px; border-radius:10px; font-size:12px; font-weight:500; margin:2px 0; white-space:nowrap; }
  .badge.done { color:#fff; background:#1f5fa8; }
  .badge.open { color:#fff; background:#c0392b; }
  tbody.st-part td, tbody.st-part td.auto { background:#fdf1dc; }
  tbody.st-part td.status { background:#f8dfb0; }
  tbody.st-part tr.addrow td { background:#faebcc; }
  .card.st-part { background:#fdf1dc; border-color:#ecd3a4; }
  .badge.part { color:#fff; background:#d9822b; }
  td.paycell { padding:4px 6px; vertical-align:top; }
  .pays { display:flex; flex-direction:column; gap:3px; }
  .pay { display:grid; grid-template-columns:96px 1fr 22px; gap:3px; align-items:center; }
  .pay input.cell { min-height:26px; height:26px; background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.08); border-radius:3px; font-size:13px; }
  .pay input.pdate { text-align:center; padding:0 2px; }
  .pdel { border:0; background:none; color:var(--muted); padding:0; font-size:16px; }
  .pdel:hover { color:var(--minus); }
  .payadd { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:22px; }
  .payadd .link { padding:2px 0; }
  .nopay { font-size:12px; padding:4px 0; }
  td.balcell { text-align:right; padding:6px 10px; }
  .ballabel { display:block; font-size:12px; font-weight:500; color:var(--muted); white-space:nowrap; }
  .balamt { display:block; font-size:17px; font-weight:700; color:var(--ink); white-space:nowrap; margin-bottom:6px; }
  .balamt:last-child { margin-bottom:0; }
  .balamt.minus { color:var(--minus); }
  .cardpays { margin-bottom:10px; background:rgba(255,255,255,.55); border:1px solid var(--line); border-radius:4px; padding:10px; }
  .cp-title { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .cardpays .pay { grid-template-columns:1fr 1.2fr 36px; gap:6px; }
  .cardpays .pay input.f { height:40px; padding:8px 10px; }
  .cardpays .pdel { border:1px solid var(--line); background:#fff; border-radius:4px; height:38px; }
  .cardpays .payadd .link { font-size:14px; padding:8px 0; }
  tbody.st-done td, tbody.st-done td.auto { background:#e3eefb; }
  tbody.st-open td, tbody.st-open td.auto { background:#fbe6e3; }
  tbody.st-done td.status { background:#c9ddf6; }
  tbody.st-open td.status { background:#f6cdc7; }
  tbody.st-done tr.addrow td { background:#d8e7f8; }
  tbody.st-open tr.addrow td { background:#f8dbd7; }
  tbody.block input.cell:hover, tbody.block select.cell:hover, td.memo textarea:hover { background:rgba(255,255,255,.6); }
  .card.st-done { background:#e3eefb; border-color:#b5cdea; }
  .card.st-open { background:#fbe6e3; border-color:#ecc2bc; }
  .card .item { background:rgba(255,255,255,.55); }
  .card-total { background:rgba(255,255,255,.6) !important; }
  .tab.report { background:#1f5fa8; color:#fff; border-color:#1f5fa8; margin-right:6px; }
  .tab.report.on { background:var(--paper); color:#1f5fa8; border-color:var(--line-strong); }
  .report { max-width:1100px; }
  .report-head { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:14px; }
  .report-head select { font:inherit; font-size:15px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; margin-left:4px; }
  .qcards { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin-bottom:16px; }
  .qcards div { background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:12px 14px; }
  .qcards span { display:block; font-size:12px; color:var(--muted); }
  .qcards strong { display:block; font-size:18px; margin:2px 0; }
  .qcards small { font-size:12px; color:var(--minus); }
  .qcards small.zero { color:var(--muted); }
  .rtable tr.m.empty th, .rtable tr.m.empty td { color:#a3abb6; }
  .qcards .ytotal { background:var(--line-strong); border-color:var(--line-strong); color:#fff; }
  .qcards .ytotal span, .qcards .ytotal small { color:#d9dee6; }
  .rwrap { overflow-x:auto; }
  .rtable { min-width:640px; }
  .rtable th, .rtable td { padding:0 12px; height:34px; }
  .rtable td { text-align:right; }
  .rtable:not(.ctable) td:nth-child(2) { text-align:center; color:var(--muted); }
  .rtable tbody th { text-align:left; font-weight:500; background:var(--paper); }
  .rtable td.sum { position:relative; font-weight:600; }
  .rtable .bar { position:absolute; left:0; bottom:4px; height:4px; background:#9dbde3; border-radius:2px; }
  .rtable tr.q th, .rtable tr.q td { background:#e3eefb; font-weight:600; }
  .rtable tr.y th, .rtable tr.y td { background:var(--line-strong); color:#fff; font-weight:600; font-size:15px; }
  .rtable tr.y td.minus { color:#ffb4aa; }
  .rtable .link { font-size:14px; padding:0; }
  .catline { flex-basis:100%; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin-top:-4px; }
  .catlabel { font-size:13px; color:var(--muted); margin-right:2px; }
  .catchip { display:inline-flex; gap:8px; align-items:baseline; background:var(--head); border-radius:14px; padding:5px 12px; font-size:15px; font-weight:600; }
  .catchip em { font-style:normal; font-weight:500; color:var(--ink); font-size:14px; }
  .cathead { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:28px 0 10px; }
  .cathead h3 { margin:0; font-size:17px; }
  .cathead select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:4px; margin-left:4px; }
  .ctable td.zero { color:#b4bbc5; }
  .ctable td.sum { font-weight:600; }
  .ctable tr.share th, .ctable tr.share td { background:var(--head); color:var(--muted); font-size:13px; }
  .tab-note { flex:none; align-self:center; margin-left:8px; font-size:12px; color:var(--muted); white-space:nowrap; }
  .badge.lt { color:var(--lt); background:var(--lt-bg); }
  td.sitecell { padding:4px; }
  textarea.cellta { width:100%; border:0; background:transparent; font:inherit; color:inherit; resize:none;
    text-align:center; line-height:1.45; padding:4px; overflow:hidden; }
  textarea.cellta:hover { background:rgba(255,255,255,.6); }
  td.memo { padding:0; vertical-align:top; height:1px; }
  td.memo textarea { display:block; width:100%; height:100%; min-height:100%; border:0; resize:none;
    background:transparent; font:inherit; color:inherit; padding:8px 10px; line-height:1.5; }
  td.memo textarea:hover { background:#f0f5fb; }
  tfoot td { background:var(--head); font-weight:600; text-align:right; padding:0 8px; border-top:2px solid var(--line-strong); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .note { color:var(--muted); font-size:12px; margin-top:10px; line-height:1.6; }

  /* 카드 보기 (스마트폰) */
  .cards { display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--line-strong); border-radius:6px; padding:14px; }
  .card.is-lt { border-top-color:var(--lt); }
  .card-head { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .card-head input { flex:1; font-size:18px; font-weight:600; }
  .card-badges { display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .f { width:100%; font:inherit; font-size:16px; color:var(--ink); padding:8px 10px; border:1px solid var(--line);
    border-radius:4px; background:#fff; }
  .f.num { text-align:right; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid2 label, .card > label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); min-width:0; }
  .grid2 .full { grid-column:1 / -1; }
  .range { display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center; }
  .items { margin:14px 0 10px; display:flex; flex-direction:column; gap:10px; }
  .item { border:1px solid var(--line); border-radius:4px; padding:10px; background:#fafbfc; }
  .item-top { display:flex; gap:6px; margin-bottom:8px; }
  .item-top input { font-weight:500; }
  .item-top button { border:1px solid var(--line); background:#fff; color:var(--muted); padding:0 12px; font-size:18px; }
  .item-bal { display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; }
  .card-total { background:var(--head); border-radius:4px; padding:10px 12px; margin-bottom:10px; font-size:13px;
    display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .card-total b { text-align:right; }
  .card textarea.f { min-height:70px; resize:vertical; line-height:1.5; }
  .card .actions { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .card .actions button.link { font-size:14px; padding:8px 6px; }

  @media (max-width: 760px) {
    header { padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px)); }
    h1 { font-size:18px; }
    .tools { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; }

  else if (/^\d{8}$/.test(s)) [y, m, d] = [+s.slice(0, 4), +s.slice(4, 6), +s.slice(6)];
  else if (/^\d{6}$/.test(s)) [y, m, d] = [2000 + +s.slice(0, 2), +s.slice(2, 4), +s.slice(4)];

}

  : v && typeof v === "object" ? "{" + Object.keys(v).sort().filter(k => v[k] !== null && v[k] !== undefined).map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}"
  : JSON.stringify(v);

function waitUser(ms) {
  return new Promise(res => {
    if (!fbReady) return res(null);
    const u = firebase.auth().currentUser; if (u) return res(u);

    const un = firebase.auth().onAuthStateChanged(x => { if (x && !done) { done = true; un(); res(x); } });

  if (cachedToken && Date.now() - tokenAt < 45 * 60000) return "auth=" + encodeURIComponent(cachedToken);

const metaObj = () => ({ extraMonths, pw:pwConf || null });

async function pushCloud(opts = {}) {
  if (cloud.busy && !opts.force) { pushCloud.again = true; return; }
  const updates = {};
  const ids = new Set(data.map(b => b.id));
  data.forEach(b => { const j = stable(b); if (sync.sent[b.id] !== j) updates[b.id] = b; });
  Object.keys(sync.sent).forEach(id => { if (!ids.has(id)) updates[id] = null; });
  const metaJ = stable(metaObj()), metaChanged = metaJ !== sync.meta;

      if (!r.ok) throw new Error("저장 실패 " + r.status);

async function pullCloud() {
  const q = await authQ();

  const localById = new Map(data.map(b => [b.id, b]));

  return t;
}
const monthLabel = m => m.slice(0, 4) === thisMonth().slice(0, 4) ? `${+m.slice(5)}월` : `${m.slice(2, 4)}년 ${+m.slice(5)}월`;

/* ---------- 계산 ---------- */
const won = n => (n < 0 ? "-₩" : "₩") + Math.abs(Math.round(n)).toLocaleString("ko-KR");
const num = v => Number(String(v).replace(/[^\d.-]/g, "")) || 0;
const fmt = n => n ? Number(n).toLocaleString("ko-KR") : "";
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const vatOf = r => (r.vat === null || r.vat === undefined) ? Math.round((r.supply || 0) * 0.1) : r.vat;
const lineOf = r => (r.supply || 0) + vatOf(r);                  // 항목별 청구액
const paidOf = b => (b.payments || []).reduce((s, x) => s + (x.amount || 0), 0);
function totalsOf(b) {
  const supply = b.rows.reduce((s, r) => s + (r.supply || 0), 0), vat = b.rows.reduce((s, r) => s + vatOf(r), 0);
  const paid = paidOf(b);
  return { supply, vat, paid, bal:supply + vat - paid };
}
const isDone = b => { const t = totalsOf(b); return t.supply + t.vat > 0 && t.bal <= 0; };
const stClass = b => isDone(b) ? "st-done" : isPartial(b) ? "st-part" : "st-open";
const isPartial = b => { const t = totalsOf(b); return t.paid > 0 && t.bal > 0; };

function periodText(b) {
  if (!isISO(b.periodStart) || !isISO(b.periodEnd)) return b.period ? esc(b.period) : "";
  const d = Math.round((parse(b.periodEnd) - parse(b.periodStart)) / 86400000) + 1;
  return d > 0 ? `${d}일` : `<span class="bad">종료일이 시작일보다 빠름</span>`;
}

/* ---------- 장기임대 ---------- */
const keyOf = b => b.periodStart || b.date || "";
const contractBills = id => data.filter(b => b.longTerm && b.contractId === id).sort((a, b) => keyOf(a).localeCompare(keyOf(b)));
const latestOf = id => { const l = contractBills(id); return l[l.length - 1]; };
const isLatest = b => b.longTerm && latestOf(b.contractId) === b;
const roundOf = b => contractBills(b.contractId).indexOf(b) + 1;
const contractEnded = id => contractBills(id).some(b => b.ltEnded);
function nextStart(b) {
  if (isISO(b.periodEnd)) return addDays(b.periodEnd, 1);
  if (isISO(b.periodStart)) return addMonths(b.periodStart, 1);
  return addMonths(isISO(b.date) ? b.date : today(), 1);
}
// 장기 계약기간(예: 9/5~12/5)을 입력하면 이번 청구는 한 달(9/5~10/4)로 줄이고, 나머지는 매달 자동으로 넘어감
function applyContract(b) {
  if (!b.longTerm || !isISO(b.periodStart) || !isISO(b.periodEnd)) return false;
  const oneMonthNext = addMonths(b.periodStart, 1);          // 한 달 뒤 같은 날
  if (b.periodEnd < oneMonthNext) return false;               // 한 달(+1일) 이내면 그대로
  const end = b.periodEnd;
  contractBills(b.contractId).forEach(x => x.contractEnd = end);
  b.contractEnd = end;
  b.periodEnd = addDays(oneMonthNext, -1);
  return end;
}
function makeNext(b) {
  const s = nextStart(b);
  let e = addDays(addMonths(s, 1), -1), last = false;
  if (b.contractEnd && isISO(b.contractEnd) && addMonths(s, 1) >= b.contractEnd) { e = b.contractEnd; last = true; }  // 마지막 달은 계약 종료일까지
  return {
    id:`${b.contractId}_${s.replace(/-/g, "")}`, date:s, company:b.company, site:b.site, manager:b.manager, phone:b.phone || "", period:"",
    periodStart:s, periodEnd:e, memo:"", contractEnd:b.contractEnd || "",
    longTerm:true, contractId:b.contractId, ltEnded:last, needCheck:true,
    rows:b.rows.map(r => ({ item:r.item, supply:r.supply || 0, vat:r.vat ?? null })), payments:[]
  };
}
const maxMonth = () => nextMonthKey(thisMonth());   // 만들 수 있는 가장 먼 달 = 다음 달
function lastMonthKey() {
  return [thisMonth(), ...extraMonths.filter(m => m <= maxMonth())].sort().pop();
}
// 진행 중인 장기임대를 마지막 월 시트까지 자동으로 넘긴다
function ensureCarryOver() {
  const until = lastMonthKey();
  const ids = [...new Set(data.filter(b => b.longTerm && b.contractId).map(b => b.contractId))];
  const made = [];
  ids.filter(id => !contractEnded(id)).forEach(id => {
    let cur = latestOf(id), guard = 0;
    while (!cur.ltEnded && nextStart(cur).slice(0, 7) <= until && guard++ < 36) {
      if (cur.contractEnd && isISO(cur.contractEnd) && nextStart(cur) > cur.contractEnd) { cur.ltEnded = true; break; }
      cur = makeNext(cur); data.push(cur); made.push(cur);
    }
  });
  if (made.length) save();
  return made;
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 3500);
}
function amtCheck(b, bi) {
  if (!b.longTerm || roundOf(b) < 2) return "";
  return b.needCheck
    ? `<div class="amtcheck"><span>이월된 금액 확인 필요</span>
        <label><input type="checkbox" data-b="${bi}" data-f="checked">확인</label></div>`
    : `<div class="amtcheck ok"><span>금액 확인됨</span>
        <label><input type="checkbox" data-b="${bi}" data-f="checked" checked>확인</label></div>`;
}
const untouchedBill = b => !b.memo && !(b.payments || []).length && b.needCheck !== false;
function setEndHere(b, on) {
  const bills = contractBills(b.contractId);
  if (on) {
    const later = bills.slice(bills.indexOf(b) + 1);
    const drop = later.filter(untouchedBill), keep = later.filter(x => !untouchedBill(x));
    bills.forEach(x => x.ltEnded = false);
    b.ltEnded = true;
    // 기간 종료일을 실제 종료한 날(오늘)로 바꿈. 오늘이 이 달 기간 밖이면 원래 종료일 유지
    const t = today();
    let endNote = "";
    if (isISO(b.periodStart) && isISO(b.periodEnd) && t >= b.periodStart && t <= b.periodEnd) {
      if (b.origEnd === undefined || b.origEnd === null) b.origEnd = b.periodEnd;
      b.periodEnd = t;
      endNote = `기간을 ${md(t)}까지로 바꿨어요(다른 날이면 종료일을 고쳐주세요)`;
    } else if (isISO(b.periodEnd)) {
      endNote = `종료일은 ${md(b.periodEnd)}로 두었어요(실제 종료일이 다르면 고쳐주세요)`;
    }
    data = data.filter(x => !drop.includes(x));
    save(); render();
    let msg = `${b.company || "이 거래"} 장기임대를 ${monthLabel(monthOf(b) || thisMonth())}로 종료했어요` + (endNote ? `. ${endNote}` : "");
    if (drop.length) msg += `. 미리 넘어가 있던 ${drop.map(monthOf).map(monthLabel).join(", ")} 건은 지웠어요`;
    if (keep.length) msg += `. ${keep.map(monthOf).map(monthLabel).join(", ")} 건은 입력된 내용이 있어서 남겨뒀어요`;
    toast(msg);
  } else {
    b.ltEnded = false;
    if (b.origEnd) { b.periodEnd = b.origEnd; }
    b.origEnd = null;
    contractBills(b.contractId).forEach(x => x.contractEnd = "");
    save();
    const made = ensureCarryOver(); render();
    toast(made.length ? `종료를 취소하고 ${[...new Set(made.map(monthOf))].map(monthLabel).join(", ")}로 다시 넘겼어요` : "종료를 취소했어요");
  }
}
function announce(made) {
  if (!made.length) return;
  const months = [...new Set(made.map(monthOf))].sort().map(monthLabel).join(", ");
  toast(`장기임대 ${made.length}건을 ${months}로 넘겼어요. 금액을 확인해주세요`);
}

/* ---------- 필터 ---------- */
function visible(b) {
  if (curTab === "report") { if (monthOf(b).slice(0, 4) !== String(reportYear)) return false; }
  else if (curTab !== "all" && monthOf(b) !== curTab) return false;
  if (filter.company && (b.company || "").trim() !== filter.company) return false;
  if (filter.status === "done" && !isDone(b)) return false;
  if (filter.status === "open" && isDone(b)) return false;
  if (filter.status === "partial" && !isPartial(b)) return false;
  if (filter.kind === "long" && !b.longTerm) return false;
  if (filter.kind === "short" && b.longTerm) return false;
  return true;
}
const allMonths = () => [...new Set([...data.map(monthOf).filter(Boolean), thisMonth(), ...extraMonths.filter(m => m <= maxMonth())])].sort();
function fmtPhone(v) {
  const d = String(v || "").replace(/\D/g, "");
  if (/^02\d{7,8}$/.test(d)) return d.length === 9 ? `02-${d.slice(2,5)}-${d.slice(5)}` : `02-${d.slice(2,6)}-${d.slice(6)}`;
  if (/^0\d{9,10}$/.test(d)) return d.length === 10 ? `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}` : `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;
  if (/^1\d{7}$/.test(d)) return `${d.slice(0,4)}-${d.slice(4)}`;

const yymm = m => `${m.slice(2, 4)}.${m.slice(5, 7)}`;
function buildFilterOptions() {
  const ms = allMonths().slice().reverse();

  document.getElementById("fMonth").innerHTML = `<option value="">전체</option>` +
    ms.map(m => `<option value="${m}" ${isMonth && m === curTab ? "selected" : ""}>${yymm(m)}</option>`).join("");
  const companies = [...new Set(data.map(b => (b.company || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "ko"));
  if (filter.company && !companies.includes(filter.company)) filter.company = "";
  document.getElementById("fCompany").innerHTML = `<option value="">전체</option>` +
    companies.map(c => `<option value="${esc(c)}" ${c === filter.company ? "selected" : ""}>${esc(c)}</option>`).join("");
  document.getElementById("fStatus").value = filter.status;

/* ---------- 공통 조각 ---------- */
function badges(b) {
  const done = isDone(b), part = isPartial(b);
  let h = `<span class="badge ${done ? "done" : part ? "part" : "open"}">${done ? "입금완료" : part ? "일부입금" : "미완료"}</span>`;
  if (b.longTerm) {
    const bills = contractBills(b.contractId), i = bills.indexOf(b);
    h += ` <span class="badge lt">${i + 1}개월차</span>`;
    if (b.ltEnded) h += ` <span class="badge end">이달 종료</span>`;
    if (i > 0 && monthOf(bills[i - 1])) h += `<span class="carry">${monthLabel(monthOf(bills[i - 1]))}에서 넘어옴</span>`;
    if (b.contractEnd) h += `<span class="carry">계약 ~${b.contractEnd.slice(2).replace(/-/g, ".")}</span>`;

}
function ltControls(b, bi) {
  if (!b.longTerm) return "";

  if (b.ltEnded) return `<span class="muted">이달로 임대 종료, 다음 달로 넘어가지 않음</span>`;
  if (nx && monthOf(nx)) return `<span class="muted">${monthLabel(monthOf(nx))}로 넘어갔음</span>`;
  if (contractEnded(b.contractId)) return "";
  return `<span class="muted">${monthLabel(nextStart(b).slice(0, 7))}로 자동으로 넘어감</span>`;
}

/* ---------- 입금 내역 (나눠서 입금해도 여러 번 기록) ---------- */

const emptyText = () => data.length ? "조건에 맞는 거래가 없습니다. 필터를 바꾸거나 초기화해 보세요." : "거래가 없습니다. 위의 ‘거래 추가’를 눌러 시작하세요.";

/* ---------- 매출 합계 (월별 / 분기별 / 연간) ---------- */
function reportRows(bills) {
  const zero = () => ({ n:0, supply:0, vat:0, paid:0, bal:0 });
  const add = (a, b) => { const t = totalsOf(b); a.n++; a.supply += t.supply; a.vat += t.vat; a.paid += t.paid; a.bal += t.bal; };
  const months = Array.from({ length:12 }, zero), quarters = Array.from({ length:4 }, zero), year = zero();
  bills.forEach(b => {
    const m = +monthOf(b).slice(5) - 1;
    if (m < 0) return;
    add(months[m], b); add(quarters[Math.floor(m / 3)], b); add(year, b);
  });
  return { months, quarters, year };
}
function reportView(bills) {
  const years = [...new Set([...data.map(b => monthOf(b).slice(0, 4)).filter(Boolean), thisMonth().slice(0, 4)])].sort();
  const { months, quarters, year } = reportRows(bills);
  const maxM = Math.max(1, ...months.map(m => m.supply + m.vat));
  const cells = (a, bar) => `
    <td>${a.n ? a.n + "건" : "-"}</td><td>${won(a.supply)}</td><td>${won(a.vat)}</td>
    <td class="sum">${won(a.supply + a.vat)}${bar ? `<span class="bar" style="width:${Math.round((a.supply + a.vat) / maxM * 100)}%"></span>` : ""}</td>
    <td>${won(a.paid)}</td><td class="${a.bal > 0 ? "minus" : ""}">${won(a.bal)}</td>`;
  let rows = "";
  quarters.forEach((q, qi) => {
    for (let k = 0; k < 3; k++) {
      const mi = qi * 3 + k, key = `${reportYear}-${pad(mi + 1)}`;
      const label = months[mi].n ? `<button class="link" data-tab="${key}">${mi + 1}월</button>` : `${mi + 1}월`;
      rows += `<tr class="m ${months[mi].n ? "" : "empty"}"><th scope="row">${label}</th>${cells(months[mi], true)}</tr>`;
    }
    rows += `<tr class="q"><th scope="row">${qi + 1}분기 합계</th>${cells(q)}</tr>`;
  });
  rows += `<tr class="y"><th scope="row">${reportYear}년 합계</th>${cells(year)}</tr>`;
  const qcards = quarters.map((q, i) => `<div><span>${i + 1}분기</span><strong>${won(q.supply + q.vat)}</strong>
    <small class="${q.bal > 0 ? "" : "zero"}">미수 ${won(q.bal)}</small></div>`).join("");
  const filt = [filter.company, filter.kind === "long" ? "장기" : filter.kind === "short" ? "단기" : "",
    filter.status === "done" ? "입금완료" : filter.status === "open" ? "미완료" : filter.status === "partial" ? "일부입금" : ""].filter(Boolean).join(", ");
  return `<div class="report">
    <div class="report-head">
      <label>연도 <select id="rYear">${years.map(y => `<option ${+y === reportYear ? "selected" : ""}>${y}</option>`).join("")}</select></label>
      <span class="muted">${filt ? `필터 적용: ${filt}` : "전체 업체 기준"} · 월은 거래 날짜 기준</span>
    </div>
    <div class="qcards">${qcards}<div class="ytotal"><span>${reportYear}년 합계</span><strong>${won(year.supply + year.vat)}</strong>
      <small>미수 ${won(year.bal)}</small></div></div>
    <div class="rwrap"><table class="rtable">
      <thead><tr><th>구분</th><th>건수</th><th>공급가액</th><th>부가세</th><th>합계<br><small>공급가+부가세</small></th><th>입금액</th><th>미수금 (잔액)</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${catReport(bills)}
    <p class="note">월 이름을 누르면 그 달 시트로 이동합니다. 업체명·입금 상태·임대 구분 필터를 고르면 그 조건으로 합계가 다시 계산됩니다.</p>
  </div>`;
}
function catReport(bills) {
  const yearBills = bills;
  const used = catNamesFor(yearBills);
  const byMonth = Array.from({ length:12 }, (_, m) => catTotals(yearBills.filter(b => +monthOf(b).slice(5) === m + 1), catBasis, used));
  const sum = arr => { const t = Object.fromEntries(used.map(n => [n, 0])); arr.forEach(x => used.forEach(n => t[n] += x[n])); return t; };
  const year = sum(byMonth);
  if (!used.length) return `<div class="cathead"><h3>항목별 매출</h3><span class="muted">입력된 항목이 없어요</span></div>`;
  const tot = x => used.reduce((s, n) => s + x[n], 0);
  const yt = tot(year) || 1;
  const cells = x => used.map(n => `<td class="${x[n] ? "" : "zero"}">${won(x[n])}</td>`).join("") + `<td class="sum">${won(tot(x))}</td>`;
  let rows = "";
  for (let q = 0; q < 4; q++) {
    for (let k = 0; k < 3; k++) {
      const m = q * 3 + k, x = byMonth[m];
      rows += `<tr class="m ${tot(x) ? "" : "empty"}"><th scope="row">${m + 1}월</th>${cells(x)}</tr>`;
    }
    rows += `<tr class="q"><th scope="row">${q + 1}분기 합계</th>${cells(sum(byMonth.slice(q * 3, q * 3 + 3)))}</tr>`;
  }
  rows += `<tr class="y"><th scope="row">${reportYear}년 합계</th>${cells(year)}</tr>`;
  const share = `<tr class="share"><th scope="row">비중</th>${used.map(n => `<td>${Math.round(year[n] / yt * 100)}%</td>`).join("")}<td>100%</td></tr>`;
  return `<div class="cathead">
      <h3>항목별 매출</h3>
      <label>기준 <select id="rBasis">
        <option value="supply" ${catBasis === "supply" ? "selected" : ""}>공급가액</option>
        <option value="total" ${catBasis === "total" ? "selected" : ""}>합계 (부가세 포함)</option></select></label>
      <span class="muted">공급내역의 첫 단어로 구분 (예: ‘발전기 120kw S-37’ → 발전기, ‘가설분전반’ → 가설분전반). 새 항목을 넣으면 여기에 생기고, 없애면 사라져요</span>
    </div>
    <div class="rwrap"><table class="rtable ctable">
      <thead><tr><th>구분</th>${used.map(n => `<th>${esc(n)}</th>`).join("")}<th>합계</th></tr></thead>
      <tbody>${rows}${share}</tbody>
    </table></div>`;
}
function reportCSV() {
  const bills = data.filter(visible), { months, quarters, year } = reportRows(bills);
  const line = (label, a) => [label, a.n, a.supply, a.vat, a.supply + a.vat, a.paid, a.bal];
  const lines = [["구분","건수","공급가액","부가세","합계","입금액","미수금"]];
  quarters.forEach((q, qi) => {
    for (let k = 0; k < 3; k++) lines.push(line(`${qi * 3 + k + 1}월`, months[qi * 3 + k]));
    lines.push(line(`${qi + 1}분기 합계`, q));
  });
  lines.push(line(`${reportYear}년 합계`, year));
  // 항목별
  lines.push([]); lines.push([`항목별 매출 (${catBasis === "total" ? "부가세 포함" : "공급가액"})`]);
  const CN = catNamesFor(bills);
  lines.push(["구분", ...CN, "합계"]);
  const byM = Array.from({ length:12 }, (_, m) => catTotals(bills.filter(b => +monthOf(b).slice(5) === m + 1), catBasis, CN));
  const sumL = arr => CN.map(n => arr.reduce((s, x) => s + x[n], 0));
  byM.forEach((x, m) => { const v = CN.map(n => x[n]); lines.push([`${m + 1}월`, ...v, v.reduce((a, c) => a + c, 0)]);
    if (m % 3 === 2) { const q = sumL(byM.slice(m - 2, m + 1)); lines.push([`${(m + 1) / 3}분기 합계`, ...q, q.reduce((a, c) => a + c, 0)]); } });
  const yv = sumL(byM); lines.push([`${reportYear}년 합계`, ...yv, yv.reduce((a, c) => a + c, 0)]);
  return lines;
}

/* ---------- 자동완성: 예전에 입력한 이름을 많이 쓴 순서로 추천 ---------- */
function buildDatalists() {
  const count = get => { const m = new Map(); data.forEach(b => get(b).forEach(v => { v = String(v || "").trim(); if (v) m.set(v, (m.get(v) || 0) + 1); })); return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ko")).map(x => x[0]); };

  fill("dl-items", count(b => b.rows.map(r => r.item)));
  fill("dl-company", count(b => [b.company]));
  fill("dl-manager", count(b => [b.manager]));

/* ---------- 화면 안 대화상자 (브라우저 기본 알림창 대신) ---------- */
function uiDialog({ msg, input = false, pin = false, placeholder = "", okText = "확인", cancel = true, danger = false }) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "uidlg";
    wrap.innerHTML = `<div class="uidlg-box" role="dialog" aria-modal="true">
      <p class="uidlg-msg"></p>
      ${input ? `<input class="uidlg-in ${pin ? "pin" : ""}" type="text" autocomplete="off" data-lpignore="true" ${pin ? 'inputmode="numeric"' : ""} placeholder="${esc(placeholder)}">` : ""}
      <div class="uidlg-btns">${cancel ? `<button class="uidlg-cancel">취소</button>` : ""}<button class="uidlg-ok ${danger ? "danger" : "primary"}">${esc(okText)}</button></div>
    </div>`;
    wrap.querySelector(".uidlg-msg").textContent = msg;
    document.body.appendChild(wrap);
    const inp = wrap.querySelector(".uidlg-in"), ok = wrap.querySelector(".uidlg-ok"), cc = wrap.querySelector(".uidlg-cancel");
    const done = v => { wrap.remove(); document.removeEventListener("keydown", onKey, true); resolve(v); };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); done(input ? null : false); }
      else if (e.key === "Enter" && (!input || document.activeElement === inp)) { e.preventDefault(); done(input ? inp.value : true); }
    };
    document.addEventListener("keydown", onKey, true);
    ok.onclick = () => done(input ? inp.value : true);
    if (cc) cc.onclick = () => done(input ? null : false);
    setTimeout(() => (inp || ok).focus(), 30);
  });
}
const uiAlert = msg => uiDialog({ msg, cancel:false });
const uiConfirm = (msg, o = {}) => uiDialog(Object.assign({ msg, okText:/삭제|지울/.test(msg) ? "삭제" : "확인", danger:/삭제|지울/.test(msg) }, o));
const uiPrompt = (msg, o = {}) => uiDialog(Object.assign({ msg, input:true }, o));

/* ---------- 간단 비밀번호 (보안용 아님, 남이 쉽게 못 보게 하는 정도) ---------- */
const PW_KEY = KEY + "-pw";
const hashPw = t => { let h = 5381; for (const c of String(t)) h = ((h << 5) + h + c.codePointAt(0)) | 0; return "h" + (h >>> 0).toString(36); };
function getPw() { return pwConf; }
// 만능 비밀번호: 원문 대신 SHA-256 값만 저장 (비밀번호를 잊었을 때 열기·변경용)
const MASTER_SHA = "84f89491577a458b31833089e928c4337e46bd7c0fe855da3352fdc76ef9e07f";
async function isMaster(t) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("haesung-sales:" + t));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("") === MASTER_SHA;
  } catch (e) { return false; }
}
function showLock() {
  const pw = getPw();
  let unlocked = false; try { unlocked = sessionStorage.getItem(PW_KEY + "-ok") === "1"; } catch (e) {}
  if (!pw || unlocked) return;
  const lock = document.getElementById("lock");
  lock.hidden = false;
  document.getElementById("lockHint").textContent = pw.hint ? `힌트: ${pw.hint}` : "";
  const inp = document.getElementById("lockInput");
  setTimeout(() => inp.focus(), 50);
  const tryOpen = async () => {
    if (hashPw(inp.value) === pw.hash || await isMaster(inp.value)) {
      try { sessionStorage.setItem(PW_KEY + "-ok", "1"); } catch (e) {}
      lock.hidden = true; inp.value = "";
    } else {
      document.getElementById("lockMsg").textContent = "비밀번호가 틀렸어요";
      inp.select();
    }
  };
  document.getElementById("lockOk").onclick = tryOpen;
  inp.onkeydown = e => { if (e.key === "Enter") tryOpen(); };
}
document.getElementById("pwBtn").onclick = async () => {

  if (pw) {
    const cur = await uiPrompt("현재 비밀번호를 입력하세요", { pin:true });
    if (cur === null) return;
    if (hashPw(cur) !== pw.hash && !(await isMaster(cur))) { uiAlert("비밀번호가 틀렸어요"); return; }
  }
  const nw = await uiPrompt(pw ? "새 비밀번호를 입력하세요\n(비워두고 확인을 누르면 비밀번호가 해제됩니다)" : "사용할 비밀번호를 입력하세요 (숫자 4자리 등)", { pin:true });

  pwConf = { hash:hashPw(nw), hint };

};
function fixups() {
  [...new Set(data.filter(b => b.longTerm && b.contractId && b.ltEnded).map(b => b.contractId))].forEach(id => {
    const bills = contractBills(id);
    if (bills.filter(b => b.ltEnded).length > 1) { bills.forEach(b => b.ltEnded = false); bills[bills.length - 1].ltEnded = true; }
  });
  data.forEach(b => { if (b.needCheck === undefined) b.needCheck = !!(b.longTerm && b.contractId && roundOf(b) > 1); });
  data.filter(b => b.longTerm && !b.ltEnded && b.contractId && isLatest(b)).forEach(applyContract);
  const lim = maxMonth();
  extraMonths = extraMonths.filter(m => m <= lim);
  const untouched = b => b.longTerm && b.needCheck && monthOf(b) > lim && !b.memo && !(b.payments || []).length;
  data = data.filter(b => !untouched(b));
}
mq.addEventListener("change", render);
(async function boot() {
  render(); setStatus();
  document.getElementById("view").insertAdjacentHTML("afterbegin", `<p class="muted" id="loadingMsg">클라우드에서 불러오는 중…</p>`);
  try { await pullCloud(); } catch (e) { cloud.online = false; cloud.error = String(e.message || e); }
  fixups();
  const made = ensureCarryOver();
  save();
  render(); announce(made); setStatus();
  showLock();
})();
setInterval(() => { if (document.visibilityState === "visible" && !isEditing()) syncNow("timer"); else setStatus(); }, 30000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow("focus"); });
window.addEventListener("online", () => syncNow("online"));
window.addEventListener("offline", () => { cloud.online = false; setStatus(); });
</script>
